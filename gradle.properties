# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Fabric — verified against meta.fabricmc.net / maven.fabricmc.net on 2026-08-29.
# Minecraft 26.x is UNOBFUSCATED: there is no yarn/intermediary/Mojang mappings line.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.20

# Mod — the version comes from the git tag (see build.gradle), never from here.
group=dev.fricker
maven_group=dev.fricker
archives_base_name=lodestore

# Dependencies
fabric_api_version=0.158.0+26.2
