name: Mod compatibility
description: Lodestore misbehaves alongside a specific other mod, or you want it to integrate with one.
title: "[Compat]: "
labels: ["compat", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Lodestore exposes its storage through `Storage<ItemVariant>`, so most pipes, hoppers, and
        storage viewers already work. When one does not, this is the place.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the [existing compatibility issues](https://github.com/fricker-studios/lodestore/issues?q=is%3Aissue+label%3Acompat).
          required: true
        - label: I have confirmed the problem goes away when the other mod is removed.
          required: true

  - type: input
    id: other-mod
    attributes:
      label: The other mod
      description: Name, version, and a link to its page or repository.
      placeholder: "Example Pipes 3.1.0 — https://modrinth.com/mod/example-pipes"
    validations:
      required: true

  - type: input
    id: lodestore-version
    attributes:
      label: Lodestore version
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Minecraft, Fabric Loader, and Fabric API versions
      placeholder: "26.2 / 0.19.3 / 0.158.0+26.2"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Crash on startup or world load
        - Crash during play
        - Items are lost, duplicated, or stuck
        - The two mods ignore each other (no crash, no interaction)
        - Rendering, GUI, or tooltip glitch
        - Feature request for an integration
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What happens?
      description: Which blocks from each mod are involved, how they are arranged, and what you expected.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: Attach `logs/latest.log` or the crash report, or link an upload on https://mclo.gs.
      render: text
