name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Needed to post the download link back onto the pull request.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'arc-runner-fricker-amd64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The pushed commit itself, not GitHub's ephemeral merge commit: the version derived
          # below embeds the sha it was built from, and the merge commit's matches nothing anyone
          # can see in the PR.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history, so the version derived from the nearest tag can see the tags. A shallow
          # checkout has none, and the jar would be named for no version at all.
          fetch-depth: 0

      # gradle-wrapper.jar is a committed binary that executes on every runner
      # and contributor machine. This fails the build if it is not a known-good
      # official Gradle wrapper.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Minecraft 26.x requires JDK 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      # The artifact and the jar inside it are named for the pull request and the run that
      # built them, the two numbers run together — pull request 57's twelfth run is
      # lodestore-5712 — or the run number alone on a push to main. The jar's version inside
      # fabric.mod.json is still derived from the nearest tag; only the file name changes. A
      # sha in the name said nothing the jar's version did not, and left a rebuilt commit with
      # two artifacts of one name.
      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          echo "label=${{ github.event.pull_request.number }}${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build --stacktrace -Pbuild_label=${{ steps.meta.outputs.label }}

      - name: Upload mod jar
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: lodestore-${{ steps.meta.outputs.label }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      # Artifacts are otherwise buried at the bottom of the run summary, with
      # no link from the PR at all.
      - name: Write job summary
        run: |
          {
            echo "## Mod jar"
            echo
            echo "**[Download lodestore-${{ steps.meta.outputs.label }}](${{ steps.upload.outputs.artifact-url }})**"
            echo
            echo "Unzip and drop the jar into \`.minecraft/mods\` next to Fabric API."
          } >> "$GITHUB_STEP_SUMMARY"

      # Skipped for fork pull requests, whose tokens are read-only.
      - name: Post download link on the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          LABEL: ${{ steps.meta.outputs.label }}
        run: |
          set -euo pipefail
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body "🧱 **Test build ready** — [lodestore-${LABEL}](${URL})

          Unzip and drop the jar into \`.minecraft/mods\` alongside Fabric API (Minecraft 26.2, Fabric Loader 0.19.3+).

          <sub>Updated automatically on each push.</sub>"
