name: Build

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

# A newer push to the same PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # gradle-wrapper.jar is a committed binary that executes on every runner
      # and contributor machine. This fails the build if it is not a known-good
      # official Gradle wrapper.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Minecraft 26.x requires JDK 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Build and test
        run: ./gradlew build --stacktrace

      # Downloadable from the run's summary page. Drop straight into
      # .minecraft/mods alongside Fabric API to test.
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: lodestore-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
