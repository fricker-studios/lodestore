name: Release

# Tagging main publishes a release with the built jar attached.
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']

# Needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: arc-runner-fricker-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so --generate-notes can diff against the previous tag.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      # The tag is the single source of truth for the version, so the jar
      # filename and the version inside fabric.mod.json cannot drift apart.
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "build/libs/lodestore-${VERSION}.jar"

          # A semver pre-release tag carries a hyphen in its version (v0.2.0-rc.1 -> 0.2.0-rc.1).
          # Without --prerelease, a release candidate publishes as the latest stable release and
          # is what anyone landing on the releases page downloads.
          prerelease=""
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --title "Lodestore ${VERSION}" \
            --generate-notes \
            ${prerelease:+"$prerelease"} \
            "build/libs/lodestore-${VERSION}.jar" \
            "build/libs/lodestore-${VERSION}-sources.jar"

      # The same jar, to Modrinth, with the release notes GitHub just generated as the changelog.
      # Skipped when the repository has no token, so a fork's release still works; a release
      # candidate goes up as a beta, as it goes up here as a pre-release. The script is
      # idempotent, and .github/workflows/modrinth.yml re-sends any release this step missed.
      - name: Set up Python
        if: ${{ secrets.MODRINTH_TOKEN != '' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Publish to Modrinth
        if: ${{ secrets.MODRINTH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json body -q .body > build/changelog.md
          game="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          python3 tools/modrinth/publish.py --tag "$GITHUB_REF_NAME" --jar "build/libs/lodestore-${VERSION}.jar" \
            --changelog build/changelog.md --game-version "${game:-26.2}"
