name: Release

# Tagging main publishes a release with the built jar attached.
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']

# Needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so --generate-notes can diff against the previous tag.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      # The tag is the single source of truth for the version, so the jar
      # filename and the version inside fabric.mod.json cannot drift apart.
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "build/libs/lodestore-${VERSION}.jar"
          gh release create "$GITHUB_REF_NAME" \
            --title "Lodestore ${VERSION}" \
            --generate-notes \
            "build/libs/lodestore-${VERSION}.jar" \
            "build/libs/lodestore-${VERSION}-sources.jar"
